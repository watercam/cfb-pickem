<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CFB Pick'em</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2330;
      --muted: #8b9bb4;
      --text: #eef3f8;
      --accent: #7eb6ff;
      --warn-bg: #2a2416;
      --warn-border: #5c4a22;
      --warn: #e6c07b;
      --fail: #f07178;
      --line: #2a3545;
      --row-alt: #151c26;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    .page {
      max-width: 960px;
      margin: 0 auto;
      padding: 1.25rem 1rem 2.5rem;
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.5rem; font-weight: 650; }
    h2 { margin: 1.6rem 0 0.4rem; font-size: 1.05rem; font-weight: 650; }
    h3 { margin: 0.85rem 0 0.2rem; font-size: 0.92rem; font-weight: 650; }
    .lede, .caption, .foot {
      color: var(--muted);
      font-size: 0.9rem;
    }
    .caption { font-size: 0.8rem; margin: 0.35rem 0 0.7rem; }
    .foot { font-size: 0.75rem; margin-top: 1.5rem; }
    .callout {
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      border-radius: 8px;
      padding: 0.8rem 0.95rem;
      margin: 1rem 0;
    }
    .callout strong { color: var(--warn); display: block; margin-bottom: 0.2rem; }
    .callout.info {
      background: #162033;
      border-color: #2c4a72;
    }
    .callout.info strong { color: var(--accent); }
    .banners { display: grid; gap: 0.65rem; margin: 1rem 0; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.75rem;
      margin: 1rem 0 0.25rem;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.7rem 0.8rem;
    }
    .stat .value {
      font-size: 1.25rem;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }
    .stat .label { color: var(--muted); font-size: 0.75rem; margin-top: 0.15rem; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; -webkit-overflow-scrolling: touch; }
    table { width: max-content; min-width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.85rem; }
    th, td {
      text-align: left;
      padding: 0.5rem 0.65rem;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    th { color: var(--muted); font-weight: 600; font-size: 0.75rem; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    tbody tr.lock td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
    tbody tr.coin td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
    .chart { margin-top: 0.5rem; }
    .bars { display: flex; flex-direction: column; gap: 0.55rem; }
    .bar-row {
      display: grid;
      grid-template-columns: minmax(8.5rem, 12rem) minmax(0, 1fr) 3.6rem;
      gap: 0.55rem;
      align-items: center;
    }
    .bar-label {
      font-size: 0.82rem;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    .bar-track {
      position: relative;
      height: 16px;
      background: var(--row-alt);
      border: 1px solid var(--line);
      border-radius: 4px;
    }
    .bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 3px;
    }
    .bar-ref {
      position: absolute;
      top: -3px;
      bottom: -3px;
      width: 1px;
      background: var(--warn);
    }
    .bar-val {
      font-variant-numeric: tabular-nums;
      font-size: 0.82rem;
      text-align: right;
    }
    .bar-legend {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.72rem;
      margin-top: 0.35rem;
      padding-left: calc(12rem + 0.55rem);
    }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0.85rem 0.95rem;
    }
    .card h3 { margin-top: 0; font-size: 0.8rem; color: var(--muted); font-weight: 600; }
    .card p { margin: 0 0 0.65rem; font-size: 0.9rem; }
    .card p:last-child { margin-bottom: 0; }
    hr { border: 0; border-top: 1px solid var(--line); margin: 1.5rem 0 1rem; }
    .error { color: var(--fail); }
    @media (max-width: 720px) {
      .stats { grid-template-columns: 1fr 1fr; }
      .cards { grid-template-columns: 1fr; }
      .bar-row {
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas: "label val" "track track";
      }
      .bar-label { grid-area: label; }
      .bar-val { grid-area: val; }
      .bar-track { grid-area: track; }
      .bar-legend { padding-left: 0; }
      .table-wrap { margin: 0 -1rem; border-radius: 0; border-left: 0; border-right: 0; }
      th:nth-child(1), td:nth-child(1) {
        position: sticky;
        left: 0;
        width: 3.5rem;
        min-width: 3.5rem;
        max-width: 3.5rem;
        background: var(--bg);
        z-index: 2;
      }
      th:nth-child(2), td:nth-child(2) {
        position: sticky;
        left: 3.5rem;
        background: var(--bg);
        z-index: 2;
        box-shadow: 6px 0 8px -6px rgba(0, 0, 0, 0.55);
      }
      thead th:nth-child(1), thead th:nth-child(2) { background: var(--card); }
      tbody tr:nth-child(even) td:nth-child(1),
      tbody tr:nth-child(even) td:nth-child(2) { background: var(--row-alt); }
      tbody tr.lock td:nth-child(1) {
        box-shadow: inset 3px 0 0 var(--warn);
      }
      tbody tr.coin td:nth-child(1) {
        box-shadow: inset 3px 0 0 var(--accent);
      }
    }
  </style>
</head>
<body>
  <div class="page" id="app">
    <p class="lede">Loading…</p>
  </div>
  <script>
    const ROOT_KEYS = ["week", "calibration", "generated_at", "games"];
    const GAME_KEYS = [
      "game_id", "pick", "opponent", "confidence", "p_current",
      "spread_move", "adj", "p_final", "flags", "public_pick_pct",
      "kickoff", "away", "home", "espn_p", "note", "pinnacle_spread"
    ];

    function fmtPct(value) {
      if (value === null || value === undefined) return "—";
      return (Number(value) * 100).toFixed(1) + "%";
    }
    function fmtSpread(value) {
      if (value === null || value === undefined) return "—";
      const n = Number(value);
      if (Number.isNaN(n)) return "—";
      const sign = n > 0 ? "+" : "";
      return sign + n.toFixed(1);
    }
    function impliedSpreadFromProb(p) {
      const n = Number(p);
      if (!Number.isFinite(n) || n <= 0 || n >= 1) return null;
      const raw = 15 * Math.log10((1 - n) / n);
      return Math.round(raw * 2) / 2;
    }
    function spreadCell(game) {
      if (game.pinnacle_spread !== null && game.pinnacle_spread !== undefined) {
        return fmtSpread(game.pinnacle_spread);
      }
      const implied = impliedSpreadFromProb(game.p_current);
      if (implied === null) return "—";
      return "≈ " + fmtSpread(implied);
    }
    function fmtMove(value) {
      if (value === null || value === undefined) return "—";
      const n = Number(value);
      if (n === 0) return "0";
      return (n > 0 ? "+" : "") + n.toFixed(1);
    }
    function fmtKick(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleString("en-US", {
        weekday: "short",
        hour: "numeric",
        minute: "2-digit",
        timeZone: "America/New_York",
        timeZoneName: "short"
      });
    }
    function fmtStamp(iso) {
      if (!iso) return "unknown time";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleString("en-US", {
        dateStyle: "medium",
        timeStyle: "short",
        timeZone: "America/New_York"
      }) + " ET";
    }
    function assertContract(payload) {
      for (const key of ROOT_KEYS) {
        if (!(key in payload)) throw new Error("Missing JSON field: " + key);
      }
      if (!Array.isArray(payload.games)) throw new Error("games must be an array");
      for (const game of payload.games) {
        for (const key of GAME_KEYS) {
          if (!(key in game)) throw new Error("Missing game field: " + key);
        }
      }
    }
    function sortGames(games) {
      return [...games].sort((a, b) => {
        const ac = a.confidence == null ? -1 : a.confidence;
        const bc = b.confidence == null ? -1 : b.confidence;
        return bc - ac;
      });
    }
    function expectedPoints(games) {
      return games.reduce((sum, g) => {
        if (g.confidence == null || g.p_current == null) return sum;
        return sum + Number(g.p_current) * Number(g.confidence);
      }, 0);
    }
    function lockingSoon(games, now) {
      return games.filter((g) => {
        if (!g.kickoff) return false;
        const t = new Date(g.kickoff).getTime();
        const mins = (t - now) / 60000;
        return mins > -15 && mins <= 90;
      });
    }
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function barChart(games) {
      const cats = games.filter((g) => g.pick && g.p_current != null);
      if (!cats.length) return "";
      const lo = 48, hi = 80;
      const mark = ((50 - lo) / (hi - lo)) * 100;
      const rows = cats.map((g) => {
        const val = Number(g.p_current) * 100;
        const width = Math.max(0, Math.min(100, ((val - lo) / (hi - lo)) * 100));
        const label = escapeHtml(String(g.confidence) + " " + g.pick);
        return `<div class="bar-row">
          <div class="bar-label">${label}</div>
          <div class="bar-track">
            <div class="bar-fill" style="width:${width.toFixed(1)}%"></div>
            <span class="bar-ref" style="left:${mark.toFixed(1)}%"></span>
          </div>
          <div class="bar-val">${fmtPct(g.p_current)}</div>
        </div>`;
      }).join("");
      return `<div class="bars" role="img" aria-label="Pinnacle no-vig win probability by confidence slot">${rows}<div class="bar-legend"><span>${lo}%</span><span>50%</span><span>${hi}%</span></div></div>`;
    }

    const app = document.getElementById("app");
    fetch("recommendations.json?t=" + Date.now())
      .then((res) => {
        if (!res.ok) throw new Error("Could not load recommendations.json");
        return res.json();
      })
      .then((payload) => {
        assertContract(payload);
        const games = sortGames(payload.games);
        const playable = games.filter((g) => g.pick);
        const week = payload.week == null ? "—" : payload.week;
        const stamp = fmtStamp(payload.generated_at);
        const exp = expectedPoints(playable);
        const soon = lockingSoon(playable, Date.now());
        const tb = payload.tiebreak || null;
        const insights = payload.insights || {};
        const espnMatch = insights.espn_match
          ? `<p class="caption">${escapeHtml(insights.espn_match)}</p>`
          : "";
        const steam = insights.steam
          ? `<p>${escapeHtml(insights.steam)}</p>`
          : "";
        const projectionBanners = (payload.alerts || []).map((alert) =>
          `<div class="callout info"><strong>Projection update</strong>${escapeHtml(alert.message || "")}</div>`
        ).join("");
        const lockBanner = soon.length
          ? `<div class="callout"><strong>Games locking soon</strong>Submit ${soon.map((g) => g.pick).join(", ")} now. Kickoff is ${fmtKick(soon[0].kickoff)}.</div>`
          : "";
        const banners = (projectionBanners + lockBanner)
          ? `<div class="banners">${projectionBanners}${lockBanner}</div>`
          : "";
        const rows = games.map((g) => {
          const failed = !g.pick;
          const cls = (!failed && g.kickoff && soon.includes(g))
            ? "lock"
            : (!failed && g.confidence === 1 ? "coin" : "");
          return `<tr class="${cls}">
            <td class="num" data-label="Conf">${g.confidence == null ? "—" : g.confidence}</td>
            <td data-label="Pick">${failed ? "No pick" : escapeHtml(g.pick)}</td>
            <td data-label="Opponent">${failed ? escapeHtml(g.away || g.home || g.game_id) : escapeHtml(g.opponent)}</td>
            <td data-label="Kickoff">${fmtKick(g.kickoff)}</td>
            <td class="num" data-label="Pinnacle p">${fmtPct(g.p_current)}</td>
            <td class="num" data-label="ESPN p">${fmtPct(g.espn_p)}</td>
            <td class="num" data-label="Public">${g.public_pick_pct == null ? "—" : Number(g.public_pick_pct).toFixed(0) + "%"}</td>
            <td class="num" data-label="Pinnacle spread">${spreadCell(g)}</td>
            <td class="num" data-label="72h spread move">${fmtMove(g.spread_move)}</td>
          </tr>`;
        }).join("");
        const thin = playable.filter((g) => g.confidence != null && g.confidence <= 5 && g.note);
        const thinHtml = thin.map((g) =>
          `<h3>${g.confidence} · ${escapeHtml(g.pick)}</h3><p>${escapeHtml(g.note)}</p>`
        ).join("");
        app.innerHTML = `
          <h1>Week ${escapeHtml(week)} confidence card</h1>
          <p class="lede">ESPN College Football Pick'em · scored ${escapeHtml(stamp)} from live Pinnacle no-vig moneylines. Movement adjustment is shown but not used for ranking (${escapeHtml(payload.calibration)}).</p>
          ${banners}
          <div class="stats">
            <div class="stat"><div class="value">10–1</div><div class="label">Confidence assignment</div></div>
            <div class="stat"><div class="value">${exp.toFixed(1)}</div><div class="label">Expected points (this card)</div></div>
            <div class="stat"><div class="value">${tb && tb.market_total != null ? tb.market_total : "—"}</div><div class="label">Tiebreak total (Pinnacle)</div></div>
            <div class="stat"><div class="value">${tb && tb.lean != null ? tb.lean : "—"}</div><div class="label">Tiebreak lean (under juice)</div></div>
          </div>
          <h2>Picks ranked by Pinnacle win probability</h2>
          <p class="caption">Source: The Odds API, Pinnacle h2h, snapshot ${escapeHtml(stamp)}. p is no-vig current moneyline. Public % is ESPN Standard pick share on the selected side. Spread is the posted Pinnacle number from that same snapshot when we have it; ≈ is implied from the displayed moneyline (15×log10 odds, rounded to a half point) — an anchor, not the spread market.</p>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th class="num">Conf</th>
                  <th>Pick</th>
                  <th>Opponent</th>
                  <th>Kickoff</th>
                  <th class="num">Pinnacle p</th>
                  <th class="num">ESPN p</th>
                  <th class="num">Public</th>
                  <th class="num">Pinnacle spread</th>
                  <th class="num">72h spread move</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <h2>Win probability by confidence slot</h2>
          <div class="chart">${barChart(playable)}</div>
          <p class="caption">Bar length: no-vig win probability (%), scaled from 48 to 80 so close games stay readable. Gold line is 50%. Source: Pinnacle via The Odds API · ${escapeHtml(stamp)}.</p>
          <h2>How this was scored</h2>
          <div class="cards">
            <div class="card">
              <h3>What we trusted</h3>
              <p>Current Pinnacle moneyline, converted to no-vig probability, then ranked 10→1. That is Model A from the local backtest.</p>
              <p>On 2,222 out-of-sample games (2023–2025), adding 72-hour spread movement made log loss worse (0.5419 → 0.5422). The shipped movement matrix is zeros. Handwritten ±1.5 / ±3.0 pp bumps are not used here.</p>
              ${espnMatch}
            </div>
            <div class="card">
              <h3>What we ignored</h3>
              <p>Public pick % is display-only. It is not mixed into win probability. For expected points in confidence mode, you still want the highest-p games on 10 and 9 even if 90%+ of the field is there.</p>
              ${steam}
            </div>
          </div>
          ${thinHtml ? "<h2>Notes on the thin games</h2>" + thinHtml : ""}
          ${tb ? `<hr><h2>Tiebreaker</h2><p>${escapeHtml(tb.detail || tb.question || "")}</p>` : ""}
          <p class="foot">Slate: ESPN confidence/standard 10. Odds: Pinnacle current plus T−72 historical snapshots. Decision time is now, not opening line. This is not betting advice; it is the expected-points card from the weekly pipeline. game_id, adj, p_final, and flags stay in recommendations.json for the CLI contract.</p>
        `;
      })
      .catch((err) => {
        app.innerHTML = '<p class="error">' + err.message + "</p>";
      });
  </script>
</body>
</html>
