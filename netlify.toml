[build]
  publish = "web"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/recommendations.json"
  [headers.values]
    Cache-Control = "no-store, no-cache, max-age=0, must-revalidate"
    CDN-Cache-Control = "no-store"
    Netlify-CDN-Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, max-age=0, must-revalidate"
